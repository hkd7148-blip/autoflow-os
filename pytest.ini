[pytest]
# Pytest конфигурация для AUTOFLOW OS

# Минимальная версия pytest
minversion = 7.0

# Директории с тестами
testpaths = tests

# Паттерн для поиска тестовых файлов
python_files = test_*.py

# Паттерн для тестовых классов и функций
python_classes = Test*
python_functions = test_*

# Опции по умолчанию
addopts =
    -ra
    --strict-markers
    --strict-config
    --showlocals
    --tb=short
    --cov=src
    --cov-report=html
    --cov-report=term-missing
    --cov-branch
    --asyncio-mode=auto
    -v

# Маркеры для категоризации тестов
markers =
    asyncio: асинхронные тесты
    unit: unit тесты (быстрые, изолированные)
    integration: интеграционные тесты (медленные, требуют зависимостей)
    slow: медленные тесты (>1 секунды)
    api: тесты API интеграций
    database: тесты с базой данных
    bot: тесты Telegram бота
    ai: тесты AI модулей (OpenAI, RAG)
    warehouse: тесты модуля склада
    crm: тесты модуля CRM
    reception: тесты модуля приёма клиентов
    brain: тесты модуля AI-диагностики

# Игнорировать предупреждения
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Таймауты для тестов
timeout = 300
timeout_method = thread

# Логирование
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Покрытие кода
[coverage:run]
source = src
omit =
    */tests/*
    */venv/*
    */__pycache__/*
    */site-packages/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = htmlcov
