[tool.poetry]
name = "autoflow-os"
version = "1.0.0"
description = "AI-powered truck service management system"
authors = ["Sergey <your@email.com>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/username/autoflow-os"
repository = "https://github.com/username/autoflow-os"
keywords = ["telegram", "bot", "ai", "crm", "erp", "truck", "service"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
    "Topic :: Office/Business",
]

[tool.poetry.dependencies]
python = "^3.11"

# Telegram Bot
aiogram = "^3.3.0"

# Web Framework
fastapi = "^0.109.0"
uvicorn = {extras = ["standard"], version = "^0.27.0"}

# Database
sqlalchemy = {extras = ["asyncio"], version = "^2.0.25"}
asyncpg = "^0.29.0"
alembic = "^1.13.1"
redis = "^5.0.1"

# AI/ML
openai = "^1.10.0"
anthropic = "^0.18.0"
langchain = "^0.1.5"
langchain-openai = "^0.0.5"
chromadb = "^0.4.22"

# Validation & Settings
pydantic = "^2.6.0"
pydantic-settings = "^2.1.0"

# HTTP Client
httpx = "^0.26.0"
aiohttp = "^3.9.3"

# Utilities
python-dotenv = "^1.0.1"
loguru = "^0.7.2"
tenacity = "^8.2.3"

# Date/Time
python-dateutil = "^2.8.2"
pytz = "^2024.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.4"
pytest-cov = "^4.1.0"
black = "^24.1.1"
isort = "^5.13.2"
flake8 = "^7.0.0"
mypy = "^1.8.0"
pre-commit = "^3.6.0"

[tool.poetry.scripts]
autoflow-bot = "src.bot.main:main"
autoflow-api = "src.api.main:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# ============================================
# Tool Configurations
# ============================================

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | migrations
)/
'''

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["src"]
skip = [".venv", "migrations"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --cov=src --cov-report=term-missing"

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
